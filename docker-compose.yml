services:
  opencode:
    image: ghcr.io/tthayer93/dockerized-opencode:latest
    # build: .                                        # uncomment this line and comment out `image:` above to build locally instead of pulling the pre-built image
    container_name: opencode
    restart: unless-stopped
    stop_grace_period: 10s
    security_opt:
      - no-new-privileges:true

    ports:
      - "4096:4096"

    volumes:
      # Your project source code (bind mount), host path configurable via HOST_WORKSPACE.
      - ${HOST_WORKSPACE:-/mnt/workspace}:/workspace
      # Host Docker socket — lets the container manage host containers.
      # This is equivalent to giving the container root on the host.
      - /var/run/docker.sock:/var/run/docker.sock
      # Config directory — entrypoint creates a default opencode.jsonc on first run.
      - ./config:/home/appuser/.config/opencode
      # Persistent data: sessions, auth tokens, logs, and project storage.
      - ./data:/home/appuser/.local/share/opencode

    environment:
      # Host path containing your project source code.
      HOST_WORKSPACE: "${HOST_WORKSPACE:-/mnt/workspace}"

      # Match the container user to your host UID/GID so bind mounts have correct ownership.
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"

      # Authentication (recommended for remote access)
      OPENCODE_SERVER_USERNAME: "${OPENCODE_SERVER_USERNAME:-username}"
      OPENCODE_SERVER_PASSWORD: "${OPENCODE_SERVER_PASSWORD:-password}"

    healthcheck:
      # Auth is enabled, so the health endpoint requires basic auth credentials.
      test: ["CMD-SHELL", "curl -sf -u \"$$OPENCODE_SERVER_USERNAME:$$OPENCODE_SERVER_PASSWORD\" http://localhost:4096/global/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
