version: 2
registries:
  ghcr:
    type: docker-registry
    url: https://ghcr.io
    username: tthayer93
    password: ${{ secrets.GHCR_PAT }}
updates:
  - package-ecosystem: "docker"
    directory: "/"
    registries:
      - ghcr
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(docker)"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(actions)"
    open-pull-requests-limit: 5
